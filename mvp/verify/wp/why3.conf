#
# The WP arm's Why3 configuration (planning/mvp-m8-plan.md, D-7 items 1, 2,
# and 7, decision A: Alt-Ergo 2.4.3 alone; specification Revision 1,
# SHA-256 aeb75682f4c300b44f98c3ba3710e6f7142ed686a597bec3bf8a484c69693b8b,
# accepted at 93a8d136; unchanged but this citation since the first run's
# against 004f31ae). The image's own configuration
# (/etc/mvp-verifier-why3.conf, from `why3 config detect`) records Alt-Ergo
# with an empty version: Fedora's build prints `2.4.3-free`, which Why3
# 1.8.2's `^[0-9.]+$` pattern for 2.4.x misses, so Why3 falls back to its
# Alt-Ergo 2.6 driver, whose polymorphic SMT-LIB 2.4.3 cannot parse (a
# struct assignment's eqmem). This file is the image's [main] section and
# the same binary with the version it prints, so that Why3 picks its
# driver for Alt-Ergo 2.4.0 to 2.4.3 (alt_ergo, the native format).
# tools/wp-arm.py sets WHY3CONFIG to it and re-runs the WP qualification
# cases under it before the leaf.
[main]
default_editor = "xdg-open %f"
magic = 14
memlimit = 1000
running_provers_max = 2
timelimit = 5.000000

[partial_prover]
name = "Alt-Ergo"
path = "/usr/bin/alt-ergo"
version = "2.4.3"
