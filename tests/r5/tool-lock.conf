#
# R5 introduces no executable identity.  It binds every normative executable
# to the accepted R3 lock, whose complete command, resolved path, version,
# digest, and owning package inventory is verified before every R5 action.
# The inherited digest is re-verified, never restated in a weaker form.
R5_TOOL_LOCK_SCHEMA=be-r5-tool-lock-v1
R5_BASE_TOOL_LOCK=tests/r3/tool-lock.conf
R5_BASE_TOOL_LOCK_SHA256=c88bd42bedebb181a301b8cffddfb9559517256df7f7363c33b09def4896ba7b
R5_NORMATIVE_ROLES=make shell node env host_gcc host_clang cross_gcc cross_as cross_ld cross_nm cross_objcopy cross_objdump cross_readelf cross_size lld qemu timeout sha256sum rpm git awk sed grep head tail cut wc cat cmp mkdir mv rm find sort date dirname

# R5 additionally binds the firmware executed below HS. QEMU's `-bios default`
# loads this exact blob, so it is a normative input and is pinned by path,
# digest, and owning package alongside the inherited emulator identity.
R5_FIRMWARE_ROLE=opensbi
R5_FIRMWARE_PATH=/usr/share/qemu/opensbi-riscv64-generic-fw_dynamic.bin
R5_FIRMWARE_SHA256=49bdf7b939bda11321132d1042bf99d7324fb190f1feef423171fed3573f8705
R5_FIRMWARE_PACKAGE=qemu-system-riscv-core-10.2.2-1.fc44.x86_64
R5_FIRMWARE_SELECTION=bios-default
