#
# R7 introduces no build-toolchain executable identity of its own. It binds
# every normative build/inspection executable to the accepted R3 lock through
# the accepted R5 lock, so the complete command, resolved path, version,
# digest, and owning package inventory is re-verified before any R7 action.
# The inherited digests are re-verified, never restated in a weaker form.
R7_TOOL_LOCK_SCHEMA=be-r7-tool-lock-v1
R7_BASE_TOOL_LOCK=tests/r3/tool-lock.conf
R7_BASE_TOOL_LOCK_SHA256=c88bd42bedebb181a301b8cffddfb9559517256df7f7363c33b09def4896ba7b
R7_ACCEPTED_R5_TOOL_LOCK=tests/r5/tool-lock.conf
R7_ACCEPTED_R5_TOOL_LOCK_SHA256=e79bd6679f3089737388b558b592649a9f67e0927a7845bab336a775d66882cb
R7_NORMATIVE_ROLES=make shell node env host_gcc host_clang cross_gcc cross_as cross_ld cross_nm cross_objcopy cross_objdump cross_readelf cross_size lld qemu timeout sha256sum rpm git awk sed grep head tail cut wc cat cmp mkdir mv rm find sort date dirname

# The one executable identity R7 introduces of its own, and the only one it
# may introduce: the pinned open Rocq 9.2 proof checker named by the accepted
# plan (planning/single-hart-runtime-r7-plan.md, "Tool and trust boundary").
# No accepted R0-R6 stage runs Rocq, so it is neither in the accepted R3
# inventory nor the accepted R5 probe set. It is bound exactly as an accepted
# lock binds a tool: absolute command, resolved path, digest, exact first
# version line, and owning package. The role is additive and R7-owned; it does
# not join the inherited inventory, is refused if it collides with an
# inherited role, and changes nothing about the delegated verification of the
# accepted 36-role set above. Both the `rocq compile` and `rocq check`
# subcommands used by the proof graph run this one bound executable; R7
# introduces no second prover binary.
R7_OWN_ROLES=rocq
R7_ROCQ_COMMAND=/usr/bin/rocq
R7_ROCQ_RESOLVED=/usr/bin/rocq
R7_ROCQ_SHA256=bc30069432d192a31292992b4ea3c7c6089c5bcf59057a0a7b4f88025b2d703c
R7_ROCQ_VERSION=The Rocq Prover, version 9.2
R7_ROCQ_PACKAGE=rocq-runtime-9.2.0-1.fc44.x86_64

# The exact immutable inputs the bounded proof consumes and never modifies,
# named by the accepted plan's "Exact immutable inputs" section. A drift in
# any of these is a predecessor regression, never an R7 proof result. Naming
# the R6 line here restates the plan's own wording for its accepted
# implementation input; it is not itself an R6 acceptance record, which
# remains planning/single-hart-runtime-r6-review-summary.md and records the
# responsible-human acceptance of that exact R6 target on 2026-08-05.
#
# The plan is pinned twice, because two exact commits were accepted for it.
# R7_ACCEPTED_PLAN_COMMIT is the original bounded plan, which carries every
# proof obligation, symbol, cut point, claim, tool, retention rule, and
# non-goal this package implements and is byte unchanged. Plan revision R7-A
# is a later, narrower accepted commit that adds only the enumeration of the
# six authorized predecessor acceptance-pin refreshes, their formulas, their
# re-derivation rule, their ordering, and their validation gate; it changes
# no obligation this package proves. Both are recorded so a reader can name
# the exact decision behind either part.
R7_ACCEPTED_PLAN_COMMIT=18c43596d308052cfad67edc6e2cb8f543f75600
R7_ACCEPTED_PLAN_REVISION=R7-A
R7_ACCEPTED_PLAN_REVISION_COMMIT=0605028220e3795d99393156d0bfb7d6a7d631a4
R7_ACCEPTED_R5_COMMIT=165f4d001a2b59b582b397bdea79ec4826168fdb
R7_ACCEPTED_R5_PARENT_COMMIT=9312c1355a23d411e3bdafb2183be342683a8ab9
R7_ACCEPTED_R6_COMMIT=7ba3649f03cf13b65df33020e345d361cce2993a
