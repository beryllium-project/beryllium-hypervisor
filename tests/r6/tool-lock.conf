#
# R6 introduces no executable identity.  It binds every normative executable to
# the accepted R3 lock through the accepted R5 lock, so the complete command,
# resolved path, version, digest, and owning package inventory is re-verified
# before any R6 action.  The inherited digests are re-verified, never restated
# in a weaker form.
R6_TOOL_LOCK_SCHEMA=be-r6-tool-lock-v1
R6_BASE_TOOL_LOCK=tests/r3/tool-lock.conf
R6_BASE_TOOL_LOCK_SHA256=c88bd42bedebb181a301b8cffddfb9559517256df7f7363c33b09def4896ba7b
R6_ACCEPTED_R5_TOOL_LOCK=tests/r5/tool-lock.conf
R6_ACCEPTED_R5_TOOL_LOCK_SHA256=e79bd6679f3089737388b558b592649a9f67e0927a7845bab336a775d66882cb
R6_NORMATIVE_ROLES=make shell node env host_gcc host_clang cross_gcc cross_as cross_ld cross_nm cross_objcopy cross_objdump cross_readelf cross_size lld qemu timeout sha256sum rpm git awk sed grep head tail cut wc cat cmp mkdir mv rm find sort date dirname

# The one executable identity R6 introduces of its own, and the only one it may
# introduce.  No accepted stage takes a kernel lock, so flock(1) is in neither
# the accepted R3 inventory nor the accepted R5 probe set; the R6 launcher does
# take one, so R6 binds the flock it launches exactly as an accepted lock binds
# a tool: absolute command, resolved path, digest, exact first version line, and
# owning package.  The role is additive and R6-owned.  It does not join the
# inherited inventory, is refused if it collides with an inherited role, and
# changes nothing about the delegated verification of the accepted 42-role and
# 36-role sets.
R6_OWN_ROLES=flock
R6_FLOCK_COMMAND=/usr/bin/flock
R6_FLOCK_PATH=/usr/bin/flock
R6_FLOCK_SHA256=c41ea2a70dab86eba37d106c0a444c58db15216c0d8435c9058dbfa178a87bf9
R6_FLOCK_VERSION=flock from util-linux 2.41.5
R6_FLOCK_PACKAGE=util-linux-core-2.41.5-1.fc44.x86_64

# The one path R6 holds a kernel lock on, and the optional record written
# beside it under that lock.  Both are confined to build/r6, and both are what
# `clean` must leave behind: removing the lock file would not release the lock,
# which the kernel holds on an open file description, but it would let the next
# invocation create a second inode at the same path and run beside this one.
R6_RUN_LOCK_ROOT=build/r6/run-lock
R6_RUN_LOCK_PATH=build/r6/run-lock/lock
R6_RUN_LOCK_OWNER=build/r6/run-lock/owner.json

# The firmware executed below HS is a normative input of every dynamic run.
# QEMU's `-bios default` loads this exact blob, so R6 pins it by path, digest,
# and owning package exactly as the accepted R5 lock does.
R6_FIRMWARE_ROLE=opensbi
R6_FIRMWARE_PATH=/usr/share/qemu/opensbi-riscv64-generic-fw_dynamic.bin
R6_FIRMWARE_SHA256=49bdf7b939bda11321132d1042bf99d7324fb190f1feef423171fed3573f8705
R6_FIRMWARE_PACKAGE=qemu-system-riscv-core-10.2.2-1.fc44.x86_64
R6_FIRMWARE_SELECTION=bios-default

# The measurement instrument.  R6 measures adversarial inputs against the
# accepted R5 mechanism and never modifies it, so the accepted target and the
# exact accepted checkers R6 invokes in a scratch tree are bound here by
# digest.  Every path below is an immutable path of the accepted R5 content
# checker, so a drift reported here is a predecessor regression, never an R6
# fixture result.
R6_ACCEPTED_R5_COMMIT=165f4d001a2b59b582b397bdea79ec4826168fdb
R6_ACCEPTED_R5_PARENT_COMMIT=9312c1355a23d411e3bdafb2183be342683a8ab9
R6_ACCEPTED_R5_PLAN_COMMIT=fecae6b62a507bdbb93d211262197a31f5422316
R6_SOURCE_CHECKER=tests/r5/check-sources.mjs
R6_SOURCE_CHECKER_SHA256=70414957241ce43e39f3a398398b9a5d12b477a23041d04a1b4cad9924ce8c46
R6_IMAGE_CHECKER=tests/r5/check-image.mjs
R6_IMAGE_CHECKER_SHA256=07486454e0d040222f8a61d37b41cd9c064e37e7df9d2d810196fe60cc1e4212
R6_PARITY_CHECKER=tests/r5/check-image-parity.mjs
R6_PARITY_CHECKER_SHA256=abbf424fdce7e0e73b8b0bf7e33039d6f1cfd395d18acdb3f8773a03f8ddc386
R6_ACCEPTED_R5_MAKEFILE=tests/r5/Makefile
R6_ACCEPTED_R5_MAKEFILE_SHA256=03f82fd51e2acd07ccfa3d0a8ad91cf315e440656e03fd686a3fa42da1cf238a
R6_ACCEPTED_R5_MAKE_CONTROL=tests/r5/make-control.mjs
R6_ACCEPTED_R5_MAKE_CONTROL_SHA256=71d1e376951171f6dcaeb6d9881ec33a93def3abb8d59d9698c096e145a671bc
R6_ACCEPTED_R5_TOOL_LOCK_MJS=tests/r5/tool-lock.mjs
R6_ACCEPTED_R5_TOOL_LOCK_MJS_SHA256=4f3841944785b891aade127b9fc3e0970d5c3ab654c4cc10ed516f74ddf19b54
R6_BASE_TOOL_LOCK_MJS=tests/r3/tool-lock.mjs
R6_BASE_TOOL_LOCK_MJS_SHA256=169b72df7dd1a3e593d12d09513dddd63787056d8731ffb68745c7ea1217617f
R6_LINKER_SCRIPT=arch/riscv/be/r5-beryllium.lds
R6_LINKER_SCRIPT_SHA256=0df278b45d33500af08204b364a3f3e61178a7cd9981cb499025d95411baa56a

# The delegated executable verifiers.  R6 starts no child process to read a
# tool's version, path, or owning package: it copies these two accepted
# checkers into an R6-owned scratch tree, byte and mode identically, and runs
# them there under the pinned node.  The accepted R3 verifier proves the whole
# 42-role identity inventory; the accepted R5 probe proves every one of the 36
# normative roles under both clean environments.  Their digests are pinned here
# so the bytes R6 delegates to cannot drift.
R6_ACCEPTED_R3_VERIFIER=tests/r3/verify-tool-lock.mjs
R6_ACCEPTED_R3_VERIFIER_SHA256=89056336d1fa00761c600fcbe079b66b1a9d575e0a0d78f15758a081c3d35330
R6_ACCEPTED_R5_VERSION_PROBE=tests/r5/probe-tool-versions.mjs
R6_ACCEPTED_R5_VERSION_PROBE_SHA256=1bf4eaf511c26a1018a8d2c3372808e0db94edd79a2101631489c577633bb319
R6_TOOLCHECK_SCRATCH=build/r6/scratch/toolcheck
R6_TOOLCHECK_SOURCES=tests/r3/tool-lock.mjs tests/r3/tool-lock.conf tests/r3/verify-tool-lock.mjs tests/r5/tool-lock.mjs tests/r5/tool-lock.conf tests/r5/probe-tool-versions.mjs
R6_ACCEPTED_R3_VERIFIER_BANNER=Beryllium R3 tool lock: PASS tools=42 path-hash-package-bound=yes
R6_ACCEPTED_R5_VERSION_PROBE_BANNER=BE_R5_TOOL_VERSION_PROBE: PASS roles=36 environments=r5-owned-and-inherited-r3 probes=72 scratch=prepared-not-assumed

# The five scratch source components, in the order tests/r6/prepare-scratch.sh
# materialises them.  `cp` and `chmod` are deliberately not bound roles in the
# accepted R3 lock, so tests/r6/materialize-scratch.mjs is the only copier and
# it runs under the pinned node.
R6_SCRATCH_SOURCE_COMPONENTS=arch include virt tests/r5 tests/r3-lock-files
R6_SCRATCH_BASE_LOCK_FILES=tests/r3/tool-lock.mjs tests/r3/tool-lock.conf
R6_SCRATCH_COPIER=tests/r6/materialize-scratch.mjs
R6_SCRATCH_COPIER_ROLE=node
