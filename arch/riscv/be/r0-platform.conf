#
# Purpose: frozen R0 platform, tool, firmware, and QEMU-command lock for the
#          fixed single-hart Beryllium runtime. Values are pinned from the
#          pinned open environment (Fedora 44) and verified by
#          tests/r0/check-tools.sh.
# Trust:   reviewable non-authoritative pin. R0 executes no Beryllium image;
#          these values gate the R1 boot package.
# Scope:   R0 freeze only. K3 hardware remains NOT RUN; QEMU results remain
#          NOT RUN for Beryllium.

# Pinned rootless base and OS (shared with the Model 0.2 profile).
os_base=fedora-44
rootless_base=registry.fedoraproject.org/fedora@sha256:daf897befd7a78a52f11db5ca2229a4923991bb30709932770cb493f7a000cf0

# Native host build tools (exact NEVRAs).
make_version=4.4.1
make_nevra=make-4.4.1-12.fc44.x86_64
gcc_version=16.1.1
gcc_nevra=gcc-16.1.1-2.fc44.x86_64
clang_version=22.1.8
clang_nevra=clang-22.1.8-1.fc44.x86_64
binutils_version=2.46.1
binutils_nevra=binutils-2.46.1-1.fc44.x86_64
lld_version=22.1.8
lld_nevra=lld-22.1.8-1.fc44.x86_64
nodejs_version=v22.22.2
nodejs_nevra=nodejs22-bin-22.22.2-3.fc44.noarch
proof_assistant=rocq-9.2

# RISC-V cross toolchain for the future R1+ image (not built at R0).
cross_gcc_version=16.1.1
cross_gcc_nevra=gcc-riscv64-linux-gnu-16.1.1-1.fc44
cross_march=rv64imac_zicsr_zifencei
cross_mabi=lp64
cross_mcmodel=medany

# Emulator (exact NEVRA).
qemu_version=10.2.2
qemu_nevra=qemu-system-riscv-core-10.2.2-1.fc44.x86_64

# Pinned OpenSBI firmware. It ships inside the QEMU RPM; the exact upstream
# source commit is not independently traceable from the packaged blob, so the
# residual is pinned honestly by byte digest, banner version, and owning NEVRA.
opensbi_firmware_path=/usr/share/qemu/opensbi-riscv64-generic-fw_dynamic.bin
opensbi_firmware_sha256=49bdf7b939bda11321132d1042bf99d7324fb190f1feef423171fed3573f8705
opensbi_banner_version=OpenSBI v1.7
opensbi_owning_nevra=qemu-system-riscv-core-10.2.2-1.fc44.x86_64
opensbi_source_traceable=no-bounded-residual-pinned-by-digest

# Verified OpenSBI handoff state (from -bios default on the pinned QEMU).
firmware_base=0x80000000
handoff_next_mode=S-mode
handoff_boot_hart_base_isa=rv64imach
handoff_a0_hartid=0
handoff_a1_pointer=firmware-dtb-recorded-not-dereferenced
handoff_pmp_count=16
handoff_mideleg=0x0000000000001666
handoff_medeleg=0x0000000000f4b509

# Frozen fixed profile.
image_entry=0x80200000
dram_base=0x80000000
dram_end=0x88000000
opensbi_reserved_base=0x80000000
opensbi_reserved_end=0x80200000

# Frozen QEMU command. F, D, and V are absent from the pinned CPU profile
# (verified base ISA rv64imach); zfa is disabled because the generic rv64 CPU
# enables it and it requires F. C stays enabled: it adds no register file and
# the packaged OpenSBI uses it. AIA, Sstc, Smstateen, Svadu, and Sdtrig/debug
# are disposed via supported CPU/machine properties.
qemu_machine=virt,aia=none
qemu_cpu=rv64,h=true,f=false,d=false,v=false,zfa=false,sv48=off,sv57=off,sstc=false,smstateen=false,svadu=false,debug=false
qemu_smp=1
qemu_memory=128M
qemu_bios=default
qemu_extra=-nographic -no-reboot
qemu_command=qemu-system-riscv64 -machine virt,aia=none -cpu rv64,h=true,f=false,d=false,v=false,zfa=false,sv48=off,sv57=off,sstc=false,smstateen=false,svadu=false,debug=false -smp 1 -m 128M -bios default -kernel <beryllium-image.elf> -nographic -no-reboot

# Claim boundary.
beryllium_qemu_result=NOT-RUN
hardware_validation=NOT-RUN
plan_revision_triggered=no-fdv-exclusion-supported
